<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Veloura | Cash out</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div class="topbar"><div class="container topbar-inner"><span>Complimentary shipping over $120</span><span>Step 2 of 3</span></div></div>
    <header><div class="container nav">
        <a class="brand" href="index.html" aria-label="Veloura home"><div class="brand-mark">V</div><span>Veloura</span></a>
        <nav class="nav-links" aria-label="Checkout navigation"><a href="index.html">Back to shop</a><a href="payment.html">Payment</a></nav>
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle color theme">Dark mode</button>
    </div></header>

    <main class="page-shell">
        <div class="container">
            <div class="page-intro"><div class="eyebrow">Cash out</div><h1>Make it yours.</h1><p>Tell us where to send your Veloura edit.</p></div>
            <div class="checkout-wrap">
                <div class="checkout-card">
                    <h3>Delivery details</h3>
                    <form class="checkout-form" id="detailsForm">
                        <div class="field full"><label for="email">Email</label><input id="email" type="email" placeholder="name@example.com" required /></div>
                        <div class="field full"><label for="name">Full name</label><input id="name" type="text" placeholder="Your name" required /></div>
                        <div class="field full"><label for="address">Shipping address</label><input id="address" type="text" placeholder="Street address" required /></div>
                        <div class="field"><label for="city">City</label><input id="city" type="text" placeholder="City" required /></div>
                        <div class="field"><label for="country">Country</label><select id="country" required><option value="">Select</option><option>United States</option><option>United Kingdom</option><option>Canada</option><option>Australia</option></select></div>
                        <div class="field full checkout-actions"><button type="submit" class="primary-btn">Continue to payment</button></div>
                    </form>
                </div>
                <aside class="order-summary"><h3>Your edit</h3><ul class="summary-list" id="checkoutItems"></ul><ul class="summary-list summary-totals"><li><span>Subtotal</span><strong id="summarySubtotal">$0</strong></li><li><span>Shipping</span><strong id="summaryShipping">$0</strong></li><li><span>Tax</span><strong id="summaryTax">$0</strong></li><li><span>Discount</span><strong id="summaryDiscount">-$0</strong></li></ul><div class="summary-row total"><span>Total</span><span id="summaryTotal">$0</span></div></aside>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
